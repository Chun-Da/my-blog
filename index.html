<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行间</title>
  <script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;})()
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="reading-progress" id="progress-bar"></div>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="#">行间</a></h1>
      <nav>
        <a href="#" class="nav-link active" data-view="home">文章</a>
        <a href="#" class="nav-link" data-view="about">关于</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="切换深浅色">◐</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app">
    <!-- 首页 -->
    <section id="view-home" class="view active">
      <div class="hero">
        <div class="hero-copy">
          <p class="hero-kicker">Personal Field Notes</p>
          <h2>把路上的光、生活里的疑问和认真想过的事写下来。</h2>
          <p>一间安静的中文博客，收集旅行、技术、AI 与日常观察。</p>
        </div>
        <div class="hero-panel" aria-hidden="true">
          <img src="img/golden-sunrise.jpg" alt="">
          <div class="hero-panel-card">
            <span>Latest Journey</span>
            <strong>峨眉山夜爬</strong>
          </div>
        </div>
      </div>
      <div class="section-heading">
        <div>
          <p class="eyebrow">Stories</p>
          <h2>最新文章</h2>
        </div>
        <span id="article-count"></span>
      </div>
      <div class="tag-filter" id="tag-filter"></div>
      <div class="article-list" id="article-list"></div>
    </section>

    <!-- 文章详情 -->
    <section id="view-article" class="view">
      <button class="back-btn" id="back-btn">&larr; 返回</button>
      <article id="article-detail"></article>
    </section>

    <!-- 关于 -->
    <section id="view-about" class="view">
      <div class="about-content">
        <div class="about-visual">
          <img src="img/gongga-golden.jpg" alt="日照金山贡嘎山">
        </div>
        <div class="about-copy">
          <div class="about-avatar">T</div>
          <p class="eyebrow">About</p>
          <h2>关于我</h2>
          <p>一个普通人，在互联网的角落里搭了个小地方写点东西。</p>
          <p>没什么宏大的目标。只是觉得人活一辈子，总该留下点什么，哪怕只是一篇游记、几句碎碎念、几张路上拍的照片。这个世界很大，我来过，我想留下一点足迹。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 行间</p>
      <div class="weather-widget" id="weather-widget"></div>
    </div>
  </footer>

  <script src="js/articles.js"></script>
  <script src="js/app.js"></script>
  <script src="js/weather.js"></script>
</body>
</html>
